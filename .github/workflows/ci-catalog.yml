name: CI Catalog

# Metadata-only gate for the demo and example catalog. Fast by design: it
# validates manifests and the generated redirect table without building or
# browser-testing anything, so a naming mistake fails in under a minute.

on:
  pull_request:
    paths:
      - '.github/workflows/ci-catalog.yml'
      - 'demos/manifest.json'
      - 'examples/manifest.json'
      - 'scripts/validate-examples-demos.ts'
      - 'scripts/__tests__/validate-examples-demos-slug.test.mjs'
      # The published-slug baseline is half of the permanence check. Without it
      # here, a PR editing only the baseline runs no catalog validation at all,
      # and a later PR could drop the matching manifest slug against an already
      # weakened baseline.
      - 'go-links/published-slugs.json'
  workflow_dispatch:

jobs:
  catalog:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - uses: pnpm/action-setup@v4
        with:
          package_json_file: package.json

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: '20'
          cache: 'pnpm'
          cache-dependency-path: pnpm-lock.yaml

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.13

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Validate demo and example metadata
        run: pnpm run check:examples-demos

      - name: Test the metadata validator
        run: pnpm run check:examples-demos:tests
