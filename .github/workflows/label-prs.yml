name: Label PRs

on:
  pull_request_target:
    types: [opened, reopened, edited]

permissions:
  contents: read
  pull-requests: write

concurrency:
  group: pr-label-${{ github.event.pull_request.number }}
  cancel-in-progress: false

jobs:
  label:
    runs-on: ubuntu-latest
    steps:
      - name: Generate app token
        id: app-token
        uses: actions/create-github-app-token@v2
        with:
          app-id: ${{ secrets.APP_ID }}
          private-key: ${{ secrets.APP_PRIVATE_KEY }}

      - name: Label editor version from target branch
        uses: actions/github-script@v7
        with:
          github-token: ${{ steps.app-token.outputs.token }}
          script: |
            const labelsByBase = {
              main: { name: 'editor: v2', color: 'f2c94c' },
              v1: { name: 'editor: v1', color: 'f2c94c' },
            };
            const base = context.payload.pull_request.base.ref;
            const desiredLabel = labelsByBase[base];
            const owner = context.repo.owner;
            const repo = context.repo.repo;
            const issue_number = context.issue.number;
            const editorLabels = Object.values(labelsByBase);

            if (desiredLabel) {
              try {
                await github.rest.issues.getLabel({ owner, repo, name: desiredLabel.name });
              } catch (error) {
                if (error.status !== 404) throw error;

                try {
                  await github.rest.issues.createLabel({ owner, repo, ...desiredLabel });
                } catch (createError) {
                  if (createError.status !== 422) throw createError;
                }
              }
            }

            const { data: currentLabels } = await github.rest.issues.listLabelsOnIssue({
              owner,
              repo,
              issue_number,
            });
            const currentLabelNames = new Set(currentLabels.map(({ name }) => name));

            for (const label of editorLabels) {
              if (label === desiredLabel || !currentLabelNames.has(label.name)) continue;

              try {
                await github.rest.issues.removeLabel({
                  owner,
                  repo,
                  issue_number,
                  name: label.name,
                });
              } catch (error) {
                if (error.status !== 404) throw error;
              }
            }

            if (desiredLabel && !currentLabelNames.has(desiredLabel.name)) {
              await github.rest.issues.addLabels({
                owner,
                repo,
                issue_number,
                labels: [desiredLabel.name],
              });
            }

            if (!desiredLabel) core.info(`Removed editor labels for unsupported base ${base}`);

      - name: Add community label
        if: >-
          github.event.action == 'opened' &&
          github.event.pull_request.user.type != 'Bot'
        uses: actions/github-script@v7
        with:
          github-token: ${{ steps.app-token.outputs.token }}
          script: |
            const owner = context.repo.owner;
            const repo = context.repo.repo;
            const prNumber = context.issue.number;
            const login = context.payload.pull_request.user.login;

            // Check repo permission (more reliable than author_association
            // which depends on token scope for org membership visibility).
            const { data: perm } = await github.rest.repos.getCollaboratorPermissionLevel({
              owner,
              repo,
              username: login,
            });

            const level = perm.permission;
            if (level === 'admin' || level === 'maintain' || level === 'write') {
              core.info(`Skipping community label — ${login} has ${level} access`);
              return;
            }

            const label = { name: 'community', color: '7057ff' };

            try {
              await github.rest.issues.getLabel({ owner, repo, name: label.name });
            } catch {
              try {
                await github.rest.issues.createLabel({ owner, repo, ...label });
              } catch (e) {
                if (e.status !== 422) throw e;
              }
            }

            await github.rest.issues.addLabels({
              owner,
              repo,
              issue_number: prNumber,
              labels: [label.name],
            });
