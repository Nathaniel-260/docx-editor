name: Notify Orbit after a public merge

on:
  pull_request_target:
    types: [closed]

permissions:
  contents: read

concurrency:
  group: notify-orbit-${{ github.event.pull_request.base.ref }}
  cancel-in-progress: false

jobs:
  notify:
    name: Notify Orbit
    if: >-
      github.event.pull_request.merged == true &&
      github.event.pull_request.base.ref == 'main'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Create an Orbit token
        id: orbit-token
        uses: actions/create-github-app-token@fee1f7d63c2ff003460e3d139729b119787bc349 # v2.2.2
        with:
          app-id: ${{ secrets.ORBIT_DISPATCH_APP_ID }}
          private-key: ${{ secrets.ORBIT_DISPATCH_APP_PRIVATE_KEY }}
          owner: superdoc
          repositories: orbit

      - name: Notify Orbit
        env:
          GH_TOKEN: ${{ steps.orbit-token.outputs.token }}
          SOURCE_BRANCH: ${{ github.event.pull_request.base.ref }}
        run: |
          set -euo pipefail

          gh api repos/superdoc/orbit/dispatches \
            -f event_type=superdoc-public-merge \
            -F client_payload[repository]="$GITHUB_REPOSITORY" \
            -F client_payload[branch]="$SOURCE_BRANCH"
