name: Update Contributors

on:
  push:
    branches: [main]
  workflow_run:
    workflows: [Update README Contributors]
    types: [completed]
    branches: [v1]
  schedule:
    - cron: "37 5 * * *"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: update-combined-contributors
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Generate app token
        id: app-token
        uses: actions/create-github-app-token@v2
        with:
          app-id: ${{ secrets.APP_ID }}
          private-key: ${{ secrets.APP_PRIVATE_KEY }}

      - uses: actions/checkout@v6
        with:
          ref: main
          token: ${{ steps.app-token.outputs.token }}

      - uses: actions/setup-node@v6
        with:
          node-version-file: .nvmrc

      - name: Generate the combined V1 and V2 image
        env:
          GITHUB_TOKEN: ${{ steps.app-token.outputs.token }}
        run: node scripts/generate-contributors.mjs

      - name: Open an update pull request
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
        run: |
          set -euo pipefail
          if git diff --quiet -- assets/contributors.svg; then
            echo 'The contributor image is already current.'
            exit 0
          fi

          branch='automation/update-contributors'
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git checkout -B "$branch"
          git add assets/contributors.svg
          git commit -m 'docs: update contributors'
          git fetch origin "+refs/heads/$branch:refs/remotes/origin/$branch" || true
          git push --force-with-lease origin "$branch"

          pr_url=$(gh pr list --base main --head "$branch" --state open --json url --jq '.[0].url')
          if [ -z "$pr_url" ]; then
            pr_url=$(gh pr create \
              --base main \
              --head "$branch" \
              --title 'docs(readme): update contributors' \
              --body 'Auto-generated from the combined `main` and `v1` commit histories.')
          fi

          for attempt in 1 2 3; do
            deadline=$((SECONDS + 2400))
            check_state=missing
            pr_head=$(gh pr view "$pr_url" --json headRefOid --jq '.headRefOid')
            while [ "$SECONDS" -lt "$deadline" ]; do
              check_state=$(gh api \
                -X GET \
                "repos/$GITHUB_REPOSITORY/commits/$pr_head/check-runs" \
                -f check_name='CI V2 Public / validate' \
                -f filter=latest \
                --jq '[.check_runs[] | select(.app.slug == "github-actions")][0] | if . == null then "missing" else "\(.status):\(.conclusion // "")" end')
              case "$check_state" in
                completed:success) break ;;
                completed:*)
                  echo "Required check failed for $pr_head: $check_state" >&2
                  exit 1
                  ;;
                *) sleep 10 ;;
              esac
            done

            if [ "$check_state" != 'completed:success' ]; then
              echo "Timed out waiting for required CI on $pr_head." >&2
              exit 1
            fi

            current_head=$(gh pr view "$pr_url" --json headRefOid --jq '.headRefOid')
            if [ "$current_head" != "$pr_head" ]; then
              echo "Contributor PR head changed while CI ran; retrying ($attempt/3)."
              continue
            fi

            gh pr merge "$pr_url" \
              --admin \
              --squash \
              --delete-branch \
              --match-head-commit "$pr_head"
            exit 0
          done

          echo 'Contributor PR head changed too many times; refusing to merge.' >&2
          exit 1
