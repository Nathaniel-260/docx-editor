name: VS Code

permissions:
  contents: read

on:
  workflow_call:
  pull_request:
    paths:
      - '.nvmrc'
      - 'package.json'
      - 'pnpm-lock.yaml'
      - 'pnpm-workspace.yaml'
      - 'apps/vscode-ext/**'
      - 'packages/superdoc/src/**'
      - '.github/workflows/vscode.yml'
  workflow_dispatch:

concurrency:
  # The workflow also runs as a child of Validate. Including the caller name
  # keeps that required run from cancelling a standalone focused run.
  group: ${{ github.workflow }}-ci-vscode-ext-${{ github.event.pull_request.number || github.run_id }}
  cancel-in-progress: true

jobs:
  detect:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: read
    outputs:
      vscode: ${{ github.event_name != 'pull_request' || steps.filter.outputs.vscode == 'true' }}
    steps:
      - uses: actions/checkout@v6

      - uses: dorny/paths-filter@fbd0ab8f3e69293af611ebaee6363fc25e6d187d # v4.0.1
        id: filter
        if: github.event_name == 'pull_request'
        with:
          filters: |
            vscode:
              - '.nvmrc'
              - 'package.json'
              - 'pnpm-lock.yaml'
              - 'pnpm-workspace.yaml'
              - 'apps/vscode-ext/**'
              - 'packages/superdoc/src/**'
              - '.github/workflows/vscode.yml'

  check:
    needs: detect
    if: needs.detect.outputs.vscode == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: pnpm

      - name: pnpm config ownership
        run: pnpm run check:pnpm-config

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Lint
        run: pnpm --filter superdoc-vscode-ext lint

      - name: Type check
        run: pnpm --filter superdoc-vscode-ext typecheck

      - name: Test
        run: pnpm --filter superdoc-vscode-ext test

      - name: Build extension host
        run: pnpm --filter superdoc-vscode-ext compile:ext

  validate:
    name: CI VS Code Extension / validate
    if: always()
    needs: [detect, check]
    runs-on: ubuntu-latest
    steps:
      - name: Check results
        run: |
          if [[ "${{ needs.detect.result }}" != "success" ]]; then
            echo "Detect job did not succeed (result: ${{ needs.detect.result }})."
            exit 1
          fi
          if [[ "${{ needs.detect.outputs.vscode }}" != "true" ]]; then
            echo "VS Code CI skipped: no relevant paths changed."
            exit 0
          fi
          if [[ "${{ needs.check.result }}" != "success" ]]; then
            echo "Check job did not succeed (result: ${{ needs.check.result }})."
            exit 1
          fi
